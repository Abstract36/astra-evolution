# Local models vs. a paid API: agents choose between the models installed in
# Ollama and DeepSeek's API, on automatically checked tasks, and evolution
# finds out which is worth paying for, task by task.
#
#   export DEEPSEEK_API_KEY=sk-...      # never put the key in a file you commit
#   astra check  --config config/deepseek.yaml
#   astra llm-run --config config/deepseek.yaml
#
# Money: 1 credit = $0.001. API calls are billed from the token usage the API
# reports, at the prices below (DeepSeek's peak rates; off-peak is half, so real
# bills are at most this). Local calls are billed by measured GPU seconds at
# ollama.cost_per_second: 0.03 credits/s = $0.00003/s, roughly 275 W at
# $0.20/kWh plus wear of a $300 GPU. What clients pay per task is virtual; the
# API spending is real and capped by sandbox.max_api_spend_usd.
#
# Values not listed here come from the defaults (see config/default.yaml).

experiment:
  name: local_vs_deepseek
  generations: 12
  seeds: 1
  population_size: 12
  arms: [evolving, static_random]

market:
  tasks_per_generation: 30
  agent_capacity: 4
  external_competition: false

economy:
  initial_budget: 20.0
  upkeep: 0.2
  bid_cost: 0.0

agent:
  exploration_trials: 2

evolution:
  defund_after: 3
  cull_fraction: 0.2
  fitness_window: 2
  spawn_cost: 0.5
  child_endowment: 6.0
  parent_reserve: 3.0
  payback_generations: 10.0

sandbox:
  max_population: 12
  max_spawns_per_generation: 3
  owner_budget: 300.0
  allowed_hosts: [127.0.0.1, localhost, "::1", api.deepseek.com]
  max_api_spend_usd: 1.0   # hard cap on real money for the whole run

ollama:
  enabled: true
  models: []
  max_model_size_gb: 10.0
  cost_per_second: 0.03
  think: false
  categories:
    - {name: arithmetic, base_price: 0.8}
    - {name: sorting, base_price: 0.8}
    - {name: counting, base_price: 0.8}
    - {name: extraction, base_price: 0.8}

api:
  enabled: true
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  credits_per_usd: 1000.0
  thinking_tokens: 1024    # effort >= 1 turns thinking on (>= 1.6: high effort)
  models:
    - {name: deepseek-flash, input_usd_per_mtok: 0.3, cached_input_usd_per_mtok: 0.006, output_usd_per_mtok: 1.2}
    - {name: deepseek-v4-pro, input_usd_per_mtok: 1.32, cached_input_usd_per_mtok: 0.044, output_usd_per_mtok: 3.96}
