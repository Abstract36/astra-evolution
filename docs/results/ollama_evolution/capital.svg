<polyline points="56.0,316.1 117.6,313.6 179.1,312.7 240.7,300.8 302.2,254.7 363.8,212.1 425.3,190.3 486.9,164.5 548.4,143.0 610.0,97.9" fill="none" stroke="var(--s-evolving)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
