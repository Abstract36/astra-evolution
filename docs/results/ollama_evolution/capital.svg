<line x1="56" y1="141.5" x2="610" y2="141.5" stroke="var(--grid)" stroke-width="1"/>
<text x="48" y="145.5" text-anchor="end">x1.2</text>
<line x1="56" y1="70.0" x2="610" y2="70.0" stroke="var(--grid)" stroke-width="1"/>
