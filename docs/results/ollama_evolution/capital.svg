<text x="56.0" y="374" text-anchor="middle">0</text>
<text x="179.1" y="374" text-anchor="middle">2</text>
<text x="302.2" y="374" text-anchor="middle">4</text>
<text x="425.3" y="374" text-anchor="middle">6</text>
<text x="548.4" y="374" text-anchor="middle">8</text>
